<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Puzzle Game</title>

    <!-- MediaPipe Hands CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-color: #000;
            --text-color: #0f0;
            --highlight: #ff0;
            --board-size: min(90vw, 90vh, 500px);
            --font-main: "Courier New", Courier, monospace;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            cursor: none;
        }

        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: var(--board-size);
            padding: 12px;
            box-sizing: border-box;
            z-index: 10;
        }

        @media (min-width: 600px) {
            header {
                flex-direction: row;
                justify-content: space-between;
                align-items: flex-end;
            }
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--text-color);
            padding: 8px 16px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--text-color);
            color: var(--bg-color);
            box-shadow: 0 0 10px var(--text-color);
        }

        button.start-btn {
            font-size: 22px;
            padding: 14px 40px;
            border: 2px solid var(--highlight);
            color: var(--highlight);
            letter-spacing: 3px;
            animation: pulseGlow 1.5s ease-in-out infinite;
        }

        button.start-btn:hover {
            background: var(--highlight);
            color: var(--bg-color);
            box-shadow: 0 0 25px var(--highlight);
        }

        @keyframes pulseGlow {

            0%,
            100% {
                box-shadow: 0 0 8px var(--highlight);
            }

            50% {
                box-shadow: 0 0 25px var(--highlight), 0 0 50px rgba(255, 255, 0, 0.3);
            }
        }

        #timer {
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 5px var(--text-color);
            visibility: hidden;
        }

        #timer.visible {
            visibility: visible;
        }

        #gameArea {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            margin-top: 10px;
            border: 2px solid var(--text-color);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            box-sizing: content-box;
            overflow: hidden;
        }

        /* Full camera preview canvas - shown before game starts */
        #previewCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* START button positioned over the preview */
        #startOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 300;
            pointer-events: all;
        }

        #startOverlay.hidden {
            display: none;
        }

        .puzzle-piece {
            position: absolute;
            box-sizing: border-box;
            border: 1px solid rgba(0, 255, 0, 0.3);
            z-index: 1;
            cursor: grab;
            user-select: none;
            touch-action: none;
            transition: transform 0.1s ease;
        }

        .puzzle-piece.snapping {
            transition: left 0.3s ease, top 0.3s ease, box-shadow 0.2s, transform 0.1s ease;
        }

        .puzzle-piece.highlight {
            border: 2px solid var(--highlight);
            box-shadow: 0 0 15px var(--highlight);
            z-index: 10;
            transform: scale(1.05);
        }

        .puzzle-piece.dragging {
            z-index: 100;
            opacity: 0.9;
        }

        .piece-canvas {
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: block;
        }

        #overlayContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 200;
        }

        #overlayCanvas {
            position: absolute;
            transform-origin: top left;
        }

        #hiddenVideo {
            display: none;
        }

        /* Loading overlay */
        #loadingOverlay {
            display: flex;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            color: var(--highlight);
            justify-content: center;
            align-items: center;
            z-index: 400;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #loadingOverlay.hidden {
            display: none;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            border: 2px solid var(--text-color);
            padding: 30px;
            text-align: center;
            background: #000;
            box-shadow: 0 0 20px var(--text-color);
            max-width: 90%;
            width: 300px;
        }

        .modal-content h2 {
            margin-top: 0;
            color: var(--highlight);
            text-shadow: 0 0 10px var(--highlight);
        }

        .modal-content input {
            background: transparent;
            border: 1px solid var(--text-color);
            color: var(--text-color);
            padding: 10px;
            font-family: inherit;
            margin: 15px 0;
            width: 80%;
            text-align: center;
            outline: none;
        }

        /* Leaderboard */
        #leaderboardPanel {
            position: fixed;
            right: -320px;
            top: 0;
            width: 300px;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            border-left: 2px solid var(--text-color);
            z-index: 500;
            padding: 20px;
            transition: right 0.3s ease;
            box-sizing: border-box;
            overflow-y: auto;
        }

        #leaderboardPanel.open {
            right: 0;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed #333;
            padding: 8px 0;
            font-size: 14px;
        }

        .close-board {
            text-align: right;
            margin-bottom: 20px;
            color: var(--highlight);
        }

        .close-board span {
            cursor: pointer;
            padding: 5px;
            border: 1px solid var(--highlight);
        }

        .close-board span:hover {
            background: var(--highlight);
            color: #000;
        }
    </style>
</head>

<body>

    <header>
        <div class="controls">
            <button id="btnLeaderboard">Leaderboard</button>
        </div>
        <div id="timer">00:00:000</div>
    </header>

    <div id="gameArea">
        <div id="loadingOverlay">INITIALIZING CAMERA...</div>

        <!-- Full camera preview canvas -->
        <canvas id="previewCanvas"></canvas>

        <!-- START button overlay -->
        <div id="startOverlay" class="hidden">
            <button class="start-btn" id="btnStart">▶ START</button>
        </div>

        <!-- Hand skeleton overlay (always visible) -->
        <div id="overlayContainer">
            <canvas id="overlayCanvas"></canvas>
        </div>
    </div>

    <!-- Hidden Video -->
    <video id="hiddenVideo" width="640" height="480" autoplay playsinline muted></video>

    <!-- Win Modal -->
    <div id="winModal" class="modal">
        <div class="modal-content">
            <h2>COMPLETE!</h2>
            <p>Final Time: <br><strong id="finalTimeDisplay" style="font-size: 24px;"></strong></p>
            <input type="text" id="playerName" placeholder="Enter Hacker Name" maxlength="15">
            <br>
            <button id="btnSaveScore">Save & Restart</button>
        </div>
    </div>

    <!-- Leaderboard -->
    <div id="leaderboardPanel">
        <div class="close-board"><span id="btnCloseBoard">[X] CLOSE</span></div>
        <h3 style="color: var(--highlight); text-align: center; margin-top:0;">LEADERBOARD</h3>
        <div id="leaderboardList"></div>
    </div>

    <script>
        // ===========================================
        // STANDALONE HAND TRACKER MODULE 
        // ===========================================
        class HandTracker {
            constructor(options) {
                this.canvasElement = options.canvasElement;
                this.ctx = this.canvasElement.getContext('2d');

                this.ownsVideoElement = !options.videoElement;
                this.videoElement = options.videoElement || null;

                this.onGrab = options.onGrab || (() => { });
                this.onMove = options.onMove || (() => { });
                this.onRelease = options.onRelease || (() => { });

                this.camera = null;
                this.hands = null;

                this.isPinching = false;
                this.grabThreshold = 30;
                this.releaseThreshold = 50;

                this.lastX = 0;
                this.lastY = 0;

                this.animationFrameId = null;
                this.currentLandmarks = null;

                this._onResultsBound = this._onResults.bind(this);
                this._renderLoopBound = this._renderLoop.bind(this);
            }

            initCamera() {
                if (!this.videoElement) {
                    this.videoElement = document.createElement('video');
                    this.videoElement.style.display = 'none';
                    this.videoElement.width = 640;
                    this.videoElement.height = 480;
                    this.videoElement.autoplay = true;
                    this.videoElement.playsInline = true;
                    document.body.appendChild(this.videoElement);
                    this.ownsVideoElement = true;
                }

                this.camera = new Camera(this.videoElement, {
                    onFrame: async () => {
                        if (this.hands) {
                            await this.hands.send({ image: this.videoElement });
                        }
                    },
                    width: 640,
                    height: 480
                });
            }

            initHands() {
                this.hands = new Hands({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
                });
                this.hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.7,
                    minTrackingConfidence: 0.7
                });
                this.hands.onResults(this._onResultsBound);
            }

            _onResults(results) {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const raw = results.multiHandLandmarks[0];
                    this.currentLandmarks = raw.map(lm => ({
                        x: 1 - lm.x, y: lm.y, z: lm.z
                    }));
                    this.detectPinch(this.currentLandmarks);
                } else {
                    this.currentLandmarks = null;
                    if (this.isPinching) {
                        this.isPinching = false;
                        this.onRelease(this.lastX, this.lastY);
                    }
                }
            }

            detectPinch(landmarks) {
                const p8 = landmarks[8], p4 = landmarks[4];
                const cw = this.canvasElement.width, ch = this.canvasElement.height;
                const x8 = p8.x * cw, y8 = p8.y * ch;
                const x4 = p4.x * cw, y4 = p4.y * ch;
                const midX = (x8 + x4) / 2, midY = (y8 + y4) / 2;
                this.lastX = midX; this.lastY = midY;
                const dist = Math.hypot(x8 - x4, y8 - y4);

                if (!this.isPinching && dist < this.grabThreshold) {
                    this.isPinching = true;
                    this.onGrab(midX, midY);
                } else if (this.isPinching && dist > this.releaseThreshold) {
                    this.isPinching = false;
                    this.onRelease(midX, midY);
                }
                if (this.isPinching) this.onMove(midX, midY);
            }

            _renderLoop() {
                this.ctx.clearRect(0, 0, this.canvasElement.width, this.canvasElement.height);
                if (this.currentLandmarks) {
                    this.ctx.save();
                    drawConnectors(this.ctx, this.currentLandmarks, HAND_CONNECTIONS, { color: '#ffffff', lineWidth: 3 });
                    drawLandmarks(this.ctx, this.currentLandmarks, { color: '#ffffff', lineWidth: 1, radius: 4 });
                    const p8 = this.currentLandmarks[8], p4 = this.currentLandmarks[4];
                    const w = this.canvasElement.width, h = this.canvasElement.height;
                    this.ctx.beginPath();
                    this.ctx.arc(p8.x * w, p8.y * h, 6, 0, 2 * Math.PI);
                    this.ctx.fillStyle = this.isPinching ? '#0f0' : '#ff0';
                    this.ctx.fill();
                    this.ctx.beginPath();
                    this.ctx.arc(p4.x * w, p4.y * h, 6, 0, 2 * Math.PI);
                    this.ctx.fillStyle = this.isPinching ? '#0f0' : '#ff0';
                    this.ctx.fill();
                    this.ctx.restore();
                }
                this.animationFrameId = requestAnimationFrame(this._renderLoopBound);
            }

            async start() {
                if (!this.hands) this.initHands();
                if (!this.camera) this.initCamera();
                if (!this.animationFrameId) {
                    this.animationFrameId = requestAnimationFrame(this._renderLoopBound);
                }
                await this.hands.initialize();
                await this.camera.start();
            }

            stop() {
                if (this.videoElement && this.videoElement.srcObject) {
                    this.videoElement.srcObject.getTracks().forEach(t => t.stop());
                    this.videoElement.srcObject = null;
                }
                if (this.camera) { this.camera.stop(); this.camera = null; }
                if (this.hands) { this.hands.close(); this.hands = null; }
                if (this.ownsVideoElement && this.videoElement) { this.videoElement.remove(); this.videoElement = null; }
                if (this.animationFrameId) { cancelAnimationFrame(this.animationFrameId); this.animationFrameId = null; }
                if (this.isPinching) { this.isPinching = false; this.onRelease(this.lastX, this.lastY); }
                this.ctx.clearRect(0, 0, this.canvasElement.width, this.canvasElement.height);
                this.currentLandmarks = null;
            }
        }

        // ===========================================
        // GAME LOGIC
        // ===========================================

        const gameState = {
            phase: "loading",  // "loading" → "preview" → "playing"
            source: null,
            pieces: [],
            grabbedPiece: null,
            isPinching: false,
            timerStart: null,
            timerRunning: false,
            elapsedTime: 0,
            boardSize: 0,
            pieceSize: 0,
            sourceWidth: 0,
            sourceHeight: 0,
            cropSize: 0,
            cropX: 0,
            cropY: 0
        };

        const DOM = {
            video: document.getElementById('hiddenVideo'),
            gameArea: document.getElementById('gameArea'),
            overlayContainer: document.getElementById('overlayContainer'),
            overlay: document.getElementById('overlayCanvas'),
            preview: document.getElementById('previewCanvas'),
            timer: document.getElementById('timer'),
            btnLeaderboard: document.getElementById('btnLeaderboard'),
            leaderboardPanel: document.getElementById('leaderboardPanel'),
            btnCloseBoard: document.getElementById('btnCloseBoard'),
            winModal: document.getElementById('winModal'),
            finalTimeDisplay: document.getElementById('finalTimeDisplay'),
            playerName: document.getElementById('playerName'),
            btnSaveScore: document.getElementById('btnSaveScore'),
            loadingOverlay: document.getElementById('loadingOverlay'),
            startOverlay: document.getElementById('startOverlay'),
            btnStart: document.getElementById('btnStart')
        };

        const previewCtx = DOM.preview.getContext('2d');
        let tracker = null;
        let videoReadyCheckInterval = null;
        let isManualDragging = false;
        let manualDragOffset = { x: 0, y: 0 };

        // ===========================================
        // INITIALIZATION
        // ===========================================

        async function initGame() {
            calculateSizes();
            window.addEventListener('resize', () => {
                calculateSizes();
                if (gameState.phase === 'playing') snapAllToGrid();
            });

            DOM.btnLeaderboard.addEventListener('click', () => DOM.leaderboardPanel.classList.add('open'));
            DOM.btnCloseBoard.addEventListener('click', () => DOM.leaderboardPanel.classList.remove('open'));
            DOM.btnSaveScore.addEventListener('click', saveScore);
            DOM.btnStart.addEventListener('click', startPuzzle);

            // Mouse & Touch events for puzzle dragging
            DOM.gameArea.addEventListener('mousedown', manualDragStart);
            document.addEventListener('mousemove', manualDragMove);
            document.addEventListener('mouseup', manualDragEnd);
            DOM.gameArea.addEventListener('touchstart', manualDragStart, { passive: false });
            document.addEventListener('touchmove', manualDragMove, { passive: false });
            document.addEventListener('touchend', manualDragEnd);

            loadLeaderboard();
            await startCamera();
            requestAnimationFrame(renderLoop);
        }

        async function startCamera() {
            gameState.phase = "loading";
            gameState.source = DOM.video;

            tracker = new HandTracker({
                canvasElement: DOM.overlay,
                videoElement: DOM.video,
                onGrab: (x, y) => {
                    if (gameState.phase !== 'playing') return;
                    const pt = mapToBoard(x, y);
                    gameState.isPinching = true;
                    tryGrabPiece(pt.x, pt.y);
                },
                onMove: (x, y) => {
                    if (gameState.phase !== 'playing') return;
                    const pt = mapToBoard(x, y);
                    handleDrag(pt.x, pt.y);
                },
                onRelease: (x, y) => {
                    if (gameState.phase !== 'playing') return;
                    gameState.isPinching = false;
                    releaseGrabbedPiece();
                }
            });

            // Robust video-ready detection
            let videoReady = false;
            const onVideoReady = () => {
                if (videoReady) return;
                const vw = DOM.video.videoWidth;
                const vh = DOM.video.videoHeight;
                if (!vw || !vh) return;
                videoReady = true;

                DOM.video.removeEventListener('loadedmetadata', onVideoReady);
                DOM.video.removeEventListener('loadeddata', onVideoReady);
                DOM.video.removeEventListener('playing', onVideoReady);
                if (videoReadyCheckInterval) { clearInterval(videoReadyCheckInterval); videoReadyCheckInterval = null; }

                gameState.sourceWidth = vw;
                gameState.sourceHeight = vh;
                calculateSizes();

                // Transition to preview phase
                gameState.phase = "preview";
                DOM.loadingOverlay.classList.add('hidden');
                DOM.startOverlay.classList.remove('hidden');
            };

            DOM.video.addEventListener('loadedmetadata', onVideoReady);
            DOM.video.addEventListener('loadeddata', onVideoReady);
            DOM.video.addEventListener('playing', onVideoReady);
            videoReadyCheckInterval = setInterval(() => {
                if (DOM.video.videoWidth > 0 && DOM.video.videoHeight > 0) onVideoReady();
            }, 250);

            try {
                await tracker.start();
                onVideoReady();
            } catch (err) {
                console.error("Camera access error:", err);
                DOM.loadingOverlay.textContent = "⚠ CAMERA ACCESS DENIED\nPlease allow camera permissions and reload.";
            }
        }

        function startPuzzle() {
            DOM.startOverlay.classList.add('hidden');
            DOM.preview.style.display = 'none'; // Hide the full preview

            gameState.phase = "playing";
            DOM.timer.classList.add('visible');

            createPieces();
            shufflePieces();
            startTimer();
        }

        // ===========================================
        // SIZING
        // ===========================================

        function calculateSizes() {
            const rect = DOM.gameArea.getBoundingClientRect();
            gameState.boardSize = rect.width;
            gameState.pieceSize = rect.width / 3;
            calculateSourceCrop();

            // Size the preview canvas to match the board
            DOM.preview.width = rect.width;
            DOM.preview.height = rect.width; // Square

            if (gameState.sourceWidth && gameState.sourceHeight) {
                const scale = gameState.boardSize / gameState.cropSize;
                DOM.overlay.width = gameState.sourceWidth;
                DOM.overlay.height = gameState.sourceHeight;
                DOM.overlay.style.width = `${gameState.sourceWidth * scale}px`;
                DOM.overlay.style.height = `${gameState.sourceHeight * scale}px`;
                DOM.overlay.style.left = `${-gameState.cropX * scale}px`;
                DOM.overlay.style.top = `${-gameState.cropY * scale}px`;
            }
        }

        function calculateSourceCrop() {
            const sw = gameState.sourceWidth, sh = gameState.sourceHeight;
            if (sw && sh) {
                gameState.cropSize = Math.min(sw, sh);
                gameState.cropX = (sw - gameState.cropSize) / 2;
                gameState.cropY = (sh - gameState.cropSize) / 2;
            }
        }

        // ===========================================
        // RENDER LOOP
        // ===========================================

        function renderLoop() {
            const bs = gameState.boardSize;
            const cs = gameState.cropSize;

            if (gameState.source && gameState.sourceWidth) {
                if (gameState.phase === "preview") {
                    // Draw full mirrored camera feed onto the preview canvas
                    previewCtx.save();
                    previewCtx.scale(-1, 1);
                    previewCtx.translate(-bs, 0);
                    previewCtx.drawImage(
                        gameState.source,
                        gameState.cropX, gameState.cropY, cs, cs,
                        0, 0, bs, bs
                    );
                    previewCtx.restore();
                }

                if (gameState.phase === "playing" && gameState.pieces.length === 9) {
                    const sourcePieceSize = cs / 3;
                    gameState.pieces.forEach(p => {
                        const origRow = Math.floor(p.originalIndex / 3);
                        const origCol = p.originalIndex % 3;
                        p.canvas.width = gameState.pieceSize;
                        p.canvas.height = gameState.pieceSize;
                        const sx = gameState.cropX + origCol * sourcePieceSize;
                        const sy = gameState.cropY + origRow * sourcePieceSize;
                        p.ctx.save();
                        p.ctx.scale(-1, 1);
                        p.ctx.translate(-gameState.pieceSize, 0);
                        p.ctx.drawImage(
                            gameState.source,
                            sx, sy, sourcePieceSize, sourcePieceSize,
                            0, 0, gameState.pieceSize, gameState.pieceSize
                        );
                        p.ctx.restore();
                    });
                }
            }

            // Timer
            if (gameState.timerRunning) {
                const diff = Date.now() - gameState.timerStart;
                const m = Math.floor(diff / 60000).toString().padStart(2, '0');
                const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                const ms = (diff % 1000).toString().padStart(3, '0');
                DOM.timer.innerText = `${m}:${s}:${ms}`;
                gameState.elapsedTime = diff;
            }

            requestAnimationFrame(renderLoop);
        }

        // ===========================================
        // COORDINATE MAPPING
        // ===========================================

        function mapToBoard(canvasX, canvasY) {
            if (!gameState.sourceWidth) return { x: 0, y: 0 };
            const scale = gameState.boardSize / gameState.cropSize;
            return {
                x: (canvasX - gameState.cropX) * scale,
                y: (canvasY - gameState.cropY) * scale
            };
        }

        // ===========================================
        // PUZZLE PIECES
        // ===========================================

        function clearBoard() {
            document.querySelectorAll('.puzzle-piece').forEach(el => el.remove());
            gameState.pieces = [];
            gameState.grabbedPiece = null;
            gameState.isPinching = false;
        }

        function createPieces() {
            clearBoard();
            const pcs = [];
            for (let i = 0; i < 9; i++) {
                const piece = document.createElement('div');
                piece.className = 'puzzle-piece';
                piece.style.width = `${gameState.pieceSize}px`;
                piece.style.height = `${gameState.pieceSize}px`;
                const canvas = document.createElement('canvas');
                canvas.className = 'piece-canvas';
                piece.appendChild(canvas);
                DOM.gameArea.appendChild(piece);
                pcs.push({
                    el: piece,
                    ctx: canvas.getContext('2d'),
                    canvas: canvas,
                    originalIndex: i,
                    currentIndex: i
                });
            }
            gameState.pieces = pcs;
        }

        function shufflePieces() {
            let idx = [0, 1, 2, 3, 4, 5, 6, 7, 8];
            for (let i = 8; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [idx[i], idx[j]] = [idx[j], idx[i]];
            }
            if (idx.every((v, i) => v === i)) [idx[0], idx[1]] = [idx[1], idx[0]];
            gameState.pieces.forEach((p, i) => {
                p.currentIndex = idx[i];
                p.el.classList.add('snapping');
            });
            snapAllToGrid();
        }

        function snapAllToGrid() {
            gameState.pieces.forEach(p => {
                p.el.style.width = `${gameState.pieceSize}px`;
                p.el.style.height = `${gameState.pieceSize}px`;
                const row = Math.floor(p.currentIndex / 3);
                const col = p.currentIndex % 3;
                p.el.style.left = `${col * gameState.pieceSize}px`;
                p.el.style.top = `${row * gameState.pieceSize}px`;
            });
        }

        // ===========================================
        // DRAG & DROP
        // ===========================================

        function tryGrabPiece(x, y) {
            let grabbed = null;
            for (let i = gameState.pieces.length - 1; i >= 0; i--) {
                const p = gameState.pieces[i];
                const px = parseFloat(p.el.style.left) || 0;
                const py = parseFloat(p.el.style.top) || 0;
                const ps = gameState.pieceSize;
                if (x >= px && x <= px + ps && y >= py && y <= py + ps) {
                    grabbed = p;
                    break;
                }
            }
            if (grabbed && !gameState.grabbedPiece) {
                gameState.grabbedPiece = grabbed;
                grabbed.el.classList.remove('snapping');
                grabbed.el.classList.add('highlight', 'dragging');
            }
        }

        function handleDrag(x, y) {
            if (!gameState.grabbedPiece) return;
            const p = gameState.grabbedPiece;
            const ps = gameState.pieceSize;
            let nx = Math.max(0, Math.min(x - ps / 2, gameState.boardSize - ps));
            let ny = Math.max(0, Math.min(y - ps / 2, gameState.boardSize - ps));
            p.el.style.left = `${nx}px`;
            p.el.style.top = `${ny}px`;
        }

        function releaseGrabbedPiece() {
            if (!gameState.grabbedPiece) return;
            const p = gameState.grabbedPiece;
            p.el.classList.remove('highlight', 'dragging');
            gameState.grabbedPiece = null;
            snapToGrid(p);
        }

        function snapToGrid(p) {
            const ps = gameState.pieceSize;
            const cx = (parseFloat(p.el.style.left) || 0) + ps / 2;
            const cy = (parseFloat(p.el.style.top) || 0) + ps / 2;
            let col = Math.max(0, Math.min(Math.floor(cx / ps), 2));
            let row = Math.max(0, Math.min(Math.floor(cy / ps), 2));
            const targetIdx = row * 3 + col;

            const existing = gameState.pieces.find(op => op !== p && op.currentIndex === targetIdx);
            p.el.classList.add('snapping');
            if (existing) {
                existing.el.classList.add('snapping');
                existing.currentIndex = p.currentIndex;
                const eRow = Math.floor(existing.currentIndex / 3);
                const eCol = existing.currentIndex % 3;
                existing.el.style.left = `${eCol * ps}px`;
                existing.el.style.top = `${eRow * ps}px`;
            }
            p.currentIndex = targetIdx;
            p.el.style.left = `${col * ps}px`;
            p.el.style.top = `${row * ps}px`;
            checkWin();
        }

        // ===========================================
        // MANUAL DRAG (Mouse/Touch)
        // ===========================================

        function manualDragStart(e) {
            if (gameState.phase !== 'playing' || gameState.isPinching) return;
            const target = e.target.closest('.puzzle-piece');
            if (!target) return;
            if (e.type === 'touchstart') e.preventDefault();

            const p = gameState.pieces.find(p => p.el === target);
            if (p && !gameState.grabbedPiece) {
                gameState.grabbedPiece = p;
                p.el.classList.remove('snapping');
                p.el.classList.add('highlight', 'dragging');
                isManualDragging = true;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const rect = p.el.getBoundingClientRect();
                manualDragOffset.x = clientX - rect.left;
                manualDragOffset.y = clientY - rect.top;
            }
        }

        function manualDragMove(e) {
            if (!isManualDragging || !gameState.grabbedPiece) return;
            if (e.type === 'touchmove') e.preventDefault();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const boardRect = DOM.gameArea.getBoundingClientRect();
            const ps = gameState.pieceSize;
            let nx = Math.max(0, Math.min(clientX - boardRect.left - manualDragOffset.x, gameState.boardSize - ps));
            let ny = Math.max(0, Math.min(clientY - boardRect.top - manualDragOffset.y, gameState.boardSize - ps));
            gameState.grabbedPiece.el.style.left = `${nx}px`;
            gameState.grabbedPiece.el.style.top = `${ny}px`;
        }

        function manualDragEnd(e) {
            if (!isManualDragging || !gameState.grabbedPiece) return;
            isManualDragging = false;
            releaseGrabbedPiece();
        }

        // ===========================================
        // TIMER & WIN
        // ===========================================

        function startTimer() {
            gameState.timerStart = Date.now();
            gameState.timerRunning = true;
        }

        function stopTimer() {
            gameState.timerRunning = false;
        }

        function checkWin() {
            if (!gameState.timerRunning) return;
            setTimeout(() => {
                if (gameState.pieces.every(p => p.originalIndex === p.currentIndex)) {
                    stopTimer();
                    DOM.finalTimeDisplay.innerText = DOM.timer.innerText;
                    DOM.winModal.classList.add('active');
                }
            }, 50);
        }

        // ===========================================
        // LEADERBOARD
        // ===========================================

        function loadLeaderboard() {
            const list = document.getElementById('leaderboardList');
            list.innerHTML = '';
            const scores = JSON.parse(localStorage.getItem('puzzleScores') || '[]');
            if (scores.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:#555">No scores yet.</div>';
            }
            scores.forEach((s, idx) => {
                const item = document.createElement('div');
                item.className = 'leaderboard-item';
                item.innerHTML = `<span>${idx + 1}. ${s.name}</span><span>${s.timeText}</span>`;
                list.appendChild(item);
            });
        }

        function saveScore() {
            const name = DOM.playerName.value.trim() || "Unknown Hacker";
            const timeText = DOM.finalTimeDisplay.innerText;
            const timeValue = gameState.elapsedTime;
            const scores = JSON.parse(localStorage.getItem('puzzleScores') || '[]');
            scores.push({ name, timeText, timeValue });
            scores.sort((a, b) => a.timeValue - b.timeValue);
            scores.splice(10);
            localStorage.setItem('puzzleScores', JSON.stringify(scores));

            DOM.winModal.classList.remove('active');
            DOM.playerName.value = '';
            loadLeaderboard();
            DOM.leaderboardPanel.classList.add('open');

            // Reset to preview mode
            gameState.phase = 'preview';
            DOM.timer.classList.remove('visible');
            DOM.timer.innerText = '00:00:000';
            clearBoard();
            DOM.preview.style.display = '';
            DOM.startOverlay.classList.remove('hidden');
            stopTimer();
        }

        // Boot
        window.addEventListener('load', initGame);
    </script>
</body>
