<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Puzzle Cam</title>

    <!-- MediaPipe Hands CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon: #0f0;
            --neon-yellow: #ff0;
            --font: "Courier New", Courier, monospace;
        }

        body {
            background: #000;
            color: var(--neon);
            font-family: var(--font);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            cursor: default;
        }

        /* Full-screen camera canvas */
        #cameraCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
        }

        /* Hand skeleton + box drawing overlay */
        #handOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 200;
            pointer-events: none;
        }

        /* Puzzle container - positioned where the box is drawn */
        #puzzleContainer {
            position: fixed;
            display: none;
            z-index: 20;
            overflow: hidden;
            border: 2px solid var(--neon);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
        }

        .puzzle-piece {
            position: absolute;
            box-sizing: border-box;
            border: 1px solid rgba(0, 255, 0, 0.3);
            z-index: 1;
            user-select: none;
            touch-action: none;
            transition: transform 0.1s ease;
        }

        .puzzle-piece.snapping {
            transition: left 0.3s ease, top 0.3s ease, box-shadow 0.2s, transform 0.1s ease;
        }

        .puzzle-piece.highlight {
            border: 2px solid var(--neon-yellow);
            box-shadow: 0 0 15px var(--neon-yellow);
            z-index: 10;
            transform: scale(1.05);
        }

        .puzzle-piece.dragging {
            z-index: 100;
            opacity: 0.9;
        }

        .piece-canvas {
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: block;
        }

        /* Thumbnail in top corner */
        #thumbnail {
            position: fixed;
            top: 15px;
            left: 15px;
            border: 2px solid var(--neon);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
            z-index: 50;
            display: none;
            max-width: 120px;
            max-height: 120px;
        }

        /* Timer */
        #timer {
            position: fixed;
            top: 15px;
            right: 15px;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 8px var(--neon);
            z-index: 50;
            display: none;
        }

        /* START button - appears after box is drawn */
        #startBtn {
            position: fixed;
            z-index: 50;
            display: none;
            background: rgba(0, 0, 0, 0.7);
            color: var(--neon-yellow);
            border: 2px solid var(--neon-yellow);
            padding: 12px 30px;
            font-family: var(--font);
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            pointer-events: all;
            animation: pulseGlow 1.5s ease-in-out infinite;
        }

        #startBtn:hover {
            background: var(--neon-yellow);
            color: #000;
            box-shadow: 0 0 25px var(--neon-yellow);
        }

        @keyframes pulseGlow {

            0%,
            100% {
                box-shadow: 0 0 8px var(--neon-yellow);
            }

            50% {
                box-shadow: 0 0 25px var(--neon-yellow), 0 0 50px rgba(255, 255, 0, 0.3);
            }
        }

        /* Instructions */
        #instructions {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            color: var(--neon);
            text-shadow: 0 0 8px var(--neon);
            z-index: 50;
            text-align: center;
            pointer-events: none;
            animation: fadeInOut 3s ease-in-out infinite;
        }

        @keyframes fadeInOut {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        /* Leaderboard button */
        #btnLeaderboard {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 60;
            background: rgba(0, 0, 0, 0.6);
            color: var(--neon);
            border: 1px solid var(--neon);
            padding: 6px 12px;
            font-family: var(--font);
            font-size: 12px;
            text-transform: uppercase;
            cursor: pointer;
            pointer-events: all;
        }

        #btnLeaderboard:hover {
            background: var(--neon);
            color: #000;
        }

        /* Leaderboard panel */
        #leaderboardPanel {
            position: fixed;
            right: -320px;
            top: 0;
            width: 300px;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            border-left: 2px solid var(--neon);
            z-index: 500;
            padding: 20px;
            transition: right 0.3s ease;
            overflow-y: auto;
        }

        #leaderboardPanel.open {
            right: 0;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed #333;
            padding: 8px 0;
            font-size: 14px;
        }

        .close-board {
            text-align: right;
            margin-bottom: 20px;
            color: var(--neon-yellow);
        }

        .close-board span {
            cursor: pointer;
            padding: 5px;
            border: 1px solid var(--neon-yellow);
        }

        .close-board span:hover {
            background: var(--neon-yellow);
            color: #000;
        }

        /* Win Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            border: 2px solid var(--neon);
            padding: 30px;
            text-align: center;
            background: #000;
            box-shadow: 0 0 20px var(--neon);
            max-width: 90%;
            width: 300px;
        }

        .modal-content h2 {
            margin-top: 0;
            color: var(--neon-yellow);
            text-shadow: 0 0 10px var(--neon-yellow);
        }

        .modal-content input {
            background: transparent;
            border: 1px solid var(--neon);
            color: var(--neon);
            padding: 10px;
            font-family: var(--font);
            margin: 15px 0;
            width: 80%;
            text-align: center;
            outline: none;
        }

        .modal-content button {
            background: transparent;
            color: var(--neon);
            border: 1px solid var(--neon);
            padding: 8px 16px;
            font-family: var(--font);
            font-size: 14px;
            text-transform: uppercase;
            cursor: pointer;
        }

        .modal-content button:hover {
            background: var(--neon);
            color: #000;
        }

        /* Loading */
        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: var(--neon-yellow);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 900;
            font-size: 18px;
            font-weight: bold;
        }

        #loadingOverlay.hidden {
            display: none;
        }

        #hiddenVideo {
            display: none;
        }

        /* Box resize controls */
        .resize-controls {
            position: fixed;
            z-index: 100;
            display: none;
            gap: 8px;
        }

        .resize-btn {
            background: rgba(0, 0, 0, 0.7);
            color: var(--neon);
            border: 1px solid var(--neon);
            width: 40px;
            height: 40px;
            font-size: 22px;
            font-family: var(--font);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: all;
        }

        .resize-btn:hover {
            background: var(--neon);
            color: #000;
            box-shadow: 0 0 10px var(--neon);
        }

        .redraw-btn {
            background: rgba(0, 0, 0, 0.7);
            color: var(--neon-yellow);
            border: 1px solid var(--neon-yellow);
            padding: 6px 14px;
            font-family: var(--font);
            font-size: 12px;
            text-transform: uppercase;
            cursor: pointer;
            pointer-events: all;
        }

        .redraw-btn:hover,
        .redraw-btn.hand-hover {
            background: var(--neon-yellow);
            color: #000;
        }

        /* Hand cursor indicator */
        #handCursor {
            position: fixed;
            width: 28px;
            height: 28px;
            border: 2px solid var(--neon);
            border-radius: 50%;
            pointer-events: none;
            z-index: 999;
            display: none;
            transform: translate(-50%, -50%);
            transition: width 0.15s, height 0.15s, background 0.15s;
        }

        #handCursor.pinching {
            width: 18px;
            height: 18px;
            background: rgba(0, 255, 0, 0.5);
            box-shadow: 0 0 15px var(--neon);
        }

        /* Button hover effect from hand */
        button.hand-hover,
        .resize-btn.hand-hover {
            box-shadow: 0 0 20px var(--neon);
            transform: scale(1.1);
        }

        #startBtn.hand-hover {
            box-shadow: 0 0 30px var(--neon-yellow), 0 0 60px rgba(255, 255, 0, 0.4);
            transform: scale(1.15);
        }
    </style>
</head>

<body>

    <div id="loadingOverlay">INITIALIZING CAMERA...</div>

    <!-- Full-screen camera -->
    <canvas id="cameraCanvas"></canvas>

    <!-- Hand skeleton + box drawing overlay -->
    <canvas id="handOverlay"></canvas>

    <!-- Puzzle container (positioned dynamically) -->
    <div id="puzzleContainer"></div>

    <!-- Captured image thumbnail -->
    <canvas id="thumbnail"></canvas>

    <!-- Timer -->
    <div id="timer">00:00:000</div>

    <!-- START button -->
    <button id="startBtn">▶ START</button>

    <!-- Box resize controls -->
    <div class="resize-controls" id="resizeControls">
        <button class="resize-btn" id="btnSmaller" title="Smaller">−</button>
        <button class="resize-btn" id="btnBigger" title="Bigger">+</button>
        <button class="redraw-btn" id="btnRedraw">↻ Redraw</button>
    </div>

    <!-- Hand cursor indicator -->
    <div id="handCursor"></div>

    <!-- Instructions -->
    <div id="instructions">✋ PINCH to draw a box on screen</div>

    <!-- Leaderboard button -->
    <button id="btnLeaderboard">Leaderboard</button>

    <!-- Hidden video -->
    <video id="hiddenVideo" width="640" height="480" autoplay playsinline muted></video>

    <!-- Win Modal -->
    <div id="winModal" class="modal">
        <div class="modal-content">
            <h2>🧩 COMPLETE!</h2>
            <p>Final Time: <br><strong id="finalTimeDisplay" style="font-size: 24px;"></strong></p>
            <input type="text" id="playerName" placeholder="Enter Name" maxlength="15">
            <br>
            <button id="btnSaveScore">Save & Play Again</button>
        </div>
    </div>

    <!-- Leaderboard Panel -->
    <div id="leaderboardPanel">
        <div class="close-board"><span id="btnCloseBoard">[X] CLOSE</span></div>
        <h3 style="color: var(--neon-yellow); text-align: center; margin-top:0;">LEADERBOARD</h3>
        <div id="leaderboardList"></div>
    </div>

    <script>
        // ===========================================
        // HAND TRACKER MODULE
        // ===========================================
        class HandTracker {
            constructor(options) {
                this.canvasElement = options.canvasElement;
                this.ctx = this.canvasElement.getContext('2d');
                this.ownsVideoElement = !options.videoElement;
                this.videoElement = options.videoElement || null;

                this.onGrab = options.onGrab || (() => { });
                this.onMove = options.onMove || (() => { });
                this.onRelease = options.onRelease || (() => { });
                this.onHandMove = options.onHandMove || (() => { });

                this.camera = null;
                this.hands = null;
                this.isPinching = false;
                this.grabThreshold = 30;
                this.releaseThreshold = 50;
                this.lastX = 0;
                this.lastY = 0;
                this.animationFrameId = null;
                this.currentLandmarks = null;
                this._onResultsBound = this._onResults.bind(this);
                this._renderLoopBound = this._renderLoop.bind(this);
            }

            initCamera() {
                if (!this.videoElement) {
                    this.videoElement = document.createElement('video');
                    this.videoElement.style.display = 'none';
                    this.videoElement.width = 640;
                    this.videoElement.height = 480;
                    this.videoElement.autoplay = true;
                    this.videoElement.playsInline = true;
                    document.body.appendChild(this.videoElement);
                    this.ownsVideoElement = true;
                }
                this.camera = new Camera(this.videoElement, {
                    onFrame: async () => {
                        if (this.hands) await this.hands.send({ image: this.videoElement });
                    },
                    width: 640, height: 480
                });
            }

            initHands() {
                this.hands = new Hands({
                    locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
                });
                this.hands.setOptions({
                    maxNumHands: 1, modelComplexity: 1,
                    minDetectionConfidence: 0.7, minTrackingConfidence: 0.7
                });
                this.hands.onResults(this._onResultsBound);
            }

            _onResults(results) {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const raw = results.multiHandLandmarks[0];
                    this.currentLandmarks = raw.map(lm => ({
                        x: 1 - lm.x, y: lm.y, z: lm.z // Mirror
                    }));
                    this.detectPinch(this.currentLandmarks);
                } else {
                    this.currentLandmarks = null;
                    if (this.isPinching) {
                        this.isPinching = false;
                        this.onRelease(this.lastX, this.lastY);
                    }
                    this.onHandMove(-1, -1, false); // Hand lost
                }
            }

            detectPinch(landmarks) {
                const p8 = landmarks[8], p4 = landmarks[4];
                const cw = this.canvasElement.width, ch = this.canvasElement.height;
                const x8 = p8.x * cw, y8 = p8.y * ch;
                const x4 = p4.x * cw, y4 = p4.y * ch;
                const midX = (x8 + x4) / 2, midY = (y8 + y4) / 2;
                this.lastX = midX; this.lastY = midY;
                const dist = Math.hypot(x8 - x4, y8 - y4);

                if (!this.isPinching && dist < this.grabThreshold) {
                    this.isPinching = true;
                    this.onGrab(midX, midY);
                } else if (this.isPinching && dist > this.releaseThreshold) {
                    this.isPinching = false;
                    this.onRelease(midX, midY);
                }
                if (this.isPinching) this.onMove(midX, midY);

                // Always report hand position
                this.onHandMove(midX, midY, this.isPinching);
            }

            _renderLoop() {
                this.ctx.clearRect(0, 0, this.canvasElement.width, this.canvasElement.height);
                if (this.currentLandmarks) {
                    this.ctx.save();
                    drawConnectors(this.ctx, this.currentLandmarks, HAND_CONNECTIONS, { color: '#ffffff', lineWidth: 3 });
                    drawLandmarks(this.ctx, this.currentLandmarks, { color: '#ffffff', lineWidth: 1, radius: 4 });
                    const p8 = this.currentLandmarks[8], p4 = this.currentLandmarks[4];
                    const w = this.canvasElement.width, h = this.canvasElement.height;
                    [p8, p4].forEach(p => {
                        this.ctx.beginPath();
                        this.ctx.arc(p.x * w, p.y * h, 6, 0, 2 * Math.PI);
                        this.ctx.fillStyle = this.isPinching ? '#0f0' : '#ff0';
                        this.ctx.fill();
                    });
                    this.ctx.restore();
                }
                this.animationFrameId = requestAnimationFrame(this._renderLoopBound);
            }

            async start() {
                if (!this.hands) this.initHands();
                if (!this.camera) this.initCamera();
                if (!this.animationFrameId) this.animationFrameId = requestAnimationFrame(this._renderLoopBound);
                await this.hands.initialize();
                await this.camera.start();
            }

            stop() {
                if (this.videoElement && this.videoElement.srcObject) {
                    this.videoElement.srcObject.getTracks().forEach(t => t.stop());
                    this.videoElement.srcObject = null;
                }
                if (this.camera) { this.camera.stop(); this.camera = null; }
                if (this.hands) { this.hands.close(); this.hands = null; }
                if (this.ownsVideoElement && this.videoElement) { this.videoElement.remove(); this.videoElement = null; }
                if (this.animationFrameId) { cancelAnimationFrame(this.animationFrameId); this.animationFrameId = null; }
                if (this.isPinching) { this.isPinching = false; this.onRelease(this.lastX, this.lastY); }
                this.ctx.clearRect(0, 0, this.canvasElement.width, this.canvasElement.height);
                this.currentLandmarks = null;
            }
        }

        // ===========================================
        // GAME STATE
        // ===========================================
        const state = {
            phase: "loading", // loading → drawing → ready → playing
            // Box coordinates (in screen pixels)
            boxStartX: 0, boxStartY: 0,
            boxEndX: 0, boxEndY: 0,
            isDrawingBox: false,
            // Puzzle
            pieces: [],
            grabbedPiece: null,
            isPinching: false,
            capturedImage: null,
            // Timer
            timerStart: null,
            timerRunning: false,
            elapsedTime: 0,
            // Video dimensions
            videoWidth: 0,
            videoHeight: 0
        };

        // DOM
        const DOM = {
            cameraCanvas: document.getElementById('cameraCanvas'),
            handOverlay: document.getElementById('handOverlay'),
            puzzleContainer: document.getElementById('puzzleContainer'),
            thumbnail: document.getElementById('thumbnail'),
            timer: document.getElementById('timer'),
            startBtn: document.getElementById('startBtn'),
            instructions: document.getElementById('instructions'),
            btnLeaderboard: document.getElementById('btnLeaderboard'),
            leaderboardPanel: document.getElementById('leaderboardPanel'),
            btnCloseBoard: document.getElementById('btnCloseBoard'),
            winModal: document.getElementById('winModal'),
            finalTimeDisplay: document.getElementById('finalTimeDisplay'),
            playerName: document.getElementById('playerName'),
            btnSaveScore: document.getElementById('btnSaveScore'),
            loadingOverlay: document.getElementById('loadingOverlay'),
            video: document.getElementById('hiddenVideo'),
            resizeControls: document.getElementById('resizeControls'),
            btnSmaller: document.getElementById('btnSmaller'),
            btnBigger: document.getElementById('btnBigger'),
            btnRedraw: document.getElementById('btnRedraw'),
            handCursor: document.getElementById('handCursor')
        };

        const camCtx = DOM.cameraCanvas.getContext('2d');
        const thumbCtx = DOM.thumbnail.getContext('2d');
        let tracker = null;

        // ===========================================
        // INIT
        // ===========================================
        async function init() {
            resizeCanvases();
            window.addEventListener('resize', resizeCanvases);

            DOM.startBtn.addEventListener('click', startPuzzle);
            DOM.btnLeaderboard.addEventListener('click', () => DOM.leaderboardPanel.classList.add('open'));
            DOM.btnCloseBoard.addEventListener('click', () => DOM.leaderboardPanel.classList.remove('open'));
            DOM.btnSaveScore.addEventListener('click', saveScore);
            DOM.btnSmaller.addEventListener('click', () => resizeBox(-40));
            DOM.btnBigger.addEventListener('click', () => resizeBox(40));
            DOM.btnRedraw.addEventListener('click', redrawBox);

            // Mouse/touch drag fallback for puzzle
            DOM.puzzleContainer.addEventListener('mousedown', manualDragStart);
            document.addEventListener('mousemove', manualDragMove);
            document.addEventListener('mouseup', manualDragEnd);
            DOM.puzzleContainer.addEventListener('touchstart', manualDragStart, { passive: false });
            document.addEventListener('touchmove', manualDragMove, { passive: false });
            document.addEventListener('touchend', manualDragEnd);

            loadLeaderboard();

            // Create hand tracker
            tracker = new HandTracker({
                canvasElement: DOM.handOverlay,
                videoElement: DOM.video,
                onGrab: onPinchGrab,
                onMove: onPinchMove,
                onRelease: onPinchRelease,
                onHandMove: onHandMove
            });

            // Wait for video ready
            let ready = false;
            const checkVideo = () => {
                if (ready) return;
                if (DOM.video.videoWidth > 0 && DOM.video.videoHeight > 0) {
                    ready = true;
                    state.videoWidth = DOM.video.videoWidth;
                    state.videoHeight = DOM.video.videoHeight;
                    DOM.loadingOverlay.classList.add('hidden');
                    state.phase = "drawing";
                    DOM.instructions.style.display = '';
                }
            };
            DOM.video.addEventListener('loadedmetadata', checkVideo);
            DOM.video.addEventListener('loadeddata', checkVideo);
            DOM.video.addEventListener('playing', checkVideo);
            const pollId = setInterval(() => {
                if (DOM.video.videoWidth > 0) { checkVideo(); if (ready) clearInterval(pollId); }
            }, 250);

            try {
                await tracker.start();
                checkVideo();
            } catch (err) {
                console.error("Camera error:", err);
                DOM.loadingOverlay.textContent = "⚠ CAMERA DENIED - Allow permissions & reload";
            }

            requestAnimationFrame(renderLoop);
        }

        function resizeCanvases() {
            const w = window.innerWidth, h = window.innerHeight;
            DOM.cameraCanvas.width = w;
            DOM.cameraCanvas.height = h;
            DOM.handOverlay.width = w;
            DOM.handOverlay.height = h;
        }

        // ===========================================
        // COORDINATE MAPPING: canvas pixels ↔ screen pixels
        // ===========================================
        // The hand overlay canvas is screen-sized but the video is 640x480.
        // HandTracker outputs coordinates in canvas (screen) pixel space
        // since it multiplies normalized coords by canvas width/height.
        // So onGrab/onMove/onRelease (x,y) are already in screen pixels.

        function canvasToVideo(screenX, screenY) {
            // Map screen position to video source position
            const vw = state.videoWidth, vh = state.videoHeight;
            const sw = window.innerWidth, sh = window.innerHeight;

            // Contain-fit: find how the video maps to the screen
            const screenAspect = sw / sh;
            const videoAspect = vw / vh;

            let drawW, drawH, offsetX, offsetY;
            if (screenAspect > videoAspect) {
                drawH = sh;
                drawW = sh * videoAspect;
                offsetX = (sw - drawW) / 2;
                offsetY = 0;
            } else {
                drawW = sw;
                drawH = sw / videoAspect;
                offsetX = 0;
                offsetY = (sh - drawH) / 2;
            }

            // Reverse the mirror: screen is mirrored, so un-mirror X
            const mirroredX = sw - screenX;

            const videoX = ((mirroredX - offsetX) / drawW) * vw;
            const videoY = ((screenY - offsetY) / drawH) * vh;

            return { x: Math.max(0, Math.min(videoX, vw)), y: Math.max(0, Math.min(videoY, vh)) };
        }

        // ===========================================
        // HAND CURSOR & BUTTON HOVER
        // ===========================================

        let lastHoveredBtn = null;

        function onHandMove(x, y, isPinching) {
            if (x < 0) {
                // Hand lost
                DOM.handCursor.style.display = 'none';
                clearButtonHover();
                return;
            }

            // Show and position cursor
            DOM.handCursor.style.display = 'block';
            DOM.handCursor.style.left = `${x}px`;
            DOM.handCursor.style.top = `${y}px`;

            if (isPinching) {
                DOM.handCursor.classList.add('pinching');
            } else {
                DOM.handCursor.classList.remove('pinching');
            }

            // Check for button hover
            const el = document.elementFromPoint(x, y);
            const btn = el ? el.closest('button, .resize-btn, .redraw-btn, .close-board span') : null;

            if (btn !== lastHoveredBtn) {
                clearButtonHover();
                if (btn) {
                    btn.classList.add('hand-hover');
                    lastHoveredBtn = btn;
                }
            }
        }

        function clearButtonHover() {
            if (lastHoveredBtn) {
                lastHoveredBtn.classList.remove('hand-hover');
                lastHoveredBtn = null;
            }
        }

        function tryClickButton(x, y) {
            const el = document.elementFromPoint(x, y);
            if (!el) return false;
            const btn = el.closest('button, .resize-btn, .redraw-btn, .close-board span, #btnSaveScore');
            if (btn && btn.offsetParent !== null) {
                btn.click();
                clearButtonHover();
                return true;
            }
            // Check if clicking on name input in modal
            const input = el.closest('input');
            if (input) {
                input.focus();
                return true;
            }
            return false;
        }

        // ===========================================
        // PINCH GESTURE HANDLERS
        // ===========================================

        function onPinchGrab(x, y) {
            // First check if pinching on a button
            if (tryClickButton(x, y)) return;

            if (state.phase === "drawing" || state.phase === "ready") {
                // Start drawing / redrawing a box
                if (state.phase === "ready") {
                    DOM.startBtn.style.display = 'none';
                    DOM.resizeControls.style.display = 'none';
                    state.phase = "drawing";
                }
                state.isDrawingBox = true;
                state.boxStartX = x;
                state.boxStartY = y;
                state.boxEndX = x;
                state.boxEndY = y;
            } else if (state.phase === "playing") {
                // Grab a puzzle piece
                state.isPinching = true;
                tryGrabPiece(x, y);
            }
        }

        function onPinchMove(x, y) {
            if (state.phase === "drawing" && state.isDrawingBox) {
                state.boxEndX = x;
                state.boxEndY = y;
            } else if (state.phase === "playing") {
                handleDrag(x, y);
            }
        }

        function onPinchRelease(x, y) {
            if (state.phase === "drawing" && state.isDrawingBox) {
                state.isDrawingBox = false;
                state.boxEndX = x;
                state.boxEndY = y;
                finalizeBox();
            } else if (state.phase === "playing") {
                state.isPinching = false;
                releaseGrabbedPiece();
            }
        }

        function finalizeBox() {
            const bx = getBoxRect();
            // Minimum box size: 100px
            if (bx.w > 100 && bx.h > 100) {
                state.phase = "ready";
                DOM.instructions.textContent = "📦 Resize or click START";

                // Position START button in center of box
                DOM.startBtn.style.left = `${bx.x + bx.w / 2 - 60}px`;
                DOM.startBtn.style.top = `${bx.y + bx.h / 2 - 20}px`;
                DOM.startBtn.style.display = 'block';

                // Position resize controls below the box
                DOM.resizeControls.style.left = `${bx.x + bx.w / 2 - 70}px`;
                DOM.resizeControls.style.top = `${bx.y + bx.h + 15}px`;
                DOM.resizeControls.style.display = 'flex';
            } else {
                // Too small, reset
                DOM.instructions.textContent = "✋ Too small! PINCH and drag a bigger box";
            }
        }

        function resizeBox(delta) {
            const bx = getBoxRect();
            const newSide = Math.max(120, bx.w + delta);
            const cx = bx.x + bx.w / 2;
            const cy = bx.y + bx.h / 2;
            state.boxStartX = cx - newSide / 2;
            state.boxStartY = cy - newSide / 2;
            state.boxEndX = cx + newSide / 2;
            state.boxEndY = cy + newSide / 2;
            finalizeBox();
        }

        function redrawBox() {
            state.phase = 'drawing';
            DOM.startBtn.style.display = 'none';
            DOM.resizeControls.style.display = 'none';
            DOM.instructions.textContent = '✋ PINCH to draw a new box';
        }

        function getBoxRect() {
            const x = Math.min(state.boxStartX, state.boxEndX);
            const y = Math.min(state.boxStartY, state.boxEndY);
            const w = Math.abs(state.boxEndX - state.boxStartX);
            const h = Math.abs(state.boxEndY - state.boxStartY);
            // Make it square using the smaller dimension
            const side = Math.min(w, h);
            const cx = x + w / 2;
            const cy = y + h / 2;
            return {
                x: cx - side / 2,
                y: cy - side / 2,
                w: side,
                h: side
            };
        }

        // ===========================================
        // START PUZZLE
        // ===========================================

        function startPuzzle() {
            const box = getBoxRect();
            state.phase = "playing";

            DOM.startBtn.style.display = 'none';
            DOM.resizeControls.style.display = 'none';
            DOM.instructions.style.display = 'none';

            // Capture the image inside the box from the camera
            captureBoxImage(box);

            // Position puzzle container at the box location
            DOM.puzzleContainer.style.left = `${box.x}px`;
            DOM.puzzleContainer.style.top = `${box.y}px`;
            DOM.puzzleContainer.style.width = `${box.w}px`;
            DOM.puzzleContainer.style.height = `${box.h}px`;
            DOM.puzzleContainer.style.display = 'block';

            // Show thumbnail & timer
            DOM.thumbnail.style.display = 'block';
            DOM.timer.style.display = 'block';
            DOM.btnLeaderboard.style.top = '50px';

            createPieces(box.w);
            shufflePieces(box.w);
            startTimer();
        }

        function captureBoxImage(box) {
            // Create the captured image from the video source
            const vw = state.videoWidth, vh = state.videoHeight;
            const sw = window.innerWidth, sh = window.innerHeight;

            // Calculate contain-fit mapping
            const screenAspect = sw / sh;
            const videoAspect = vw / vh;
            let drawW, drawH, offsetX, offsetY;
            if (screenAspect > videoAspect) {
                drawH = sh; drawW = sh * videoAspect;
                offsetX = (sw - drawW) / 2; offsetY = 0;
            } else {
                drawW = sw; drawH = sw / videoAspect;
                offsetX = 0; offsetY = (sh - drawH) / 2;
            }

            // Map box screen coords to video source coords (un-mirror X)
            const boxRight = sw - box.x;        // mirrored left edge
            const boxLeft = sw - (box.x + box.w); // mirrored right edge

            const srcX = ((boxLeft - offsetX) / drawW) * vw;
            const srcY = ((box.y - offsetY) / drawH) * vh;
            const srcW = ((boxRight - boxLeft) / drawW) * vw;
            const srcH = (box.h / drawH) * vh;

            // Capture to an off-screen canvas
            const capCanvas = document.createElement('canvas');
            capCanvas.width = box.w;
            capCanvas.height = box.h;
            const capCtx = capCanvas.getContext('2d');
            capCtx.drawImage(DOM.video, srcX, srcY, srcW, srcH, 0, 0, box.w, box.h);

            state.capturedImage = capCanvas;

            // Draw thumbnail
            const thumbSize = 120;
            DOM.thumbnail.width = thumbSize;
            DOM.thumbnail.height = thumbSize;
            thumbCtx.drawImage(capCanvas, 0, 0, box.w, box.h, 0, 0, thumbSize, thumbSize);
        }

        // ===========================================
        // RENDER LOOP
        // ===========================================

        function renderLoop() {
            const sw = window.innerWidth, sh = window.innerHeight;
            const vw = state.videoWidth, vh = state.videoHeight;

            // Draw mirrored camera feed on full-screen canvas with contain-fit
            if (vw && vh) {
                const screenAspect = sw / sh;
                const videoAspect = vw / vh;
                let drawW, drawH, offsetX, offsetY;
                if (screenAspect > videoAspect) {
                    drawH = sh; drawW = sh * videoAspect;
                    offsetX = (sw - drawW) / 2; offsetY = 0;
                } else {
                    drawW = sw; drawH = sw / videoAspect;
                    offsetX = 0; offsetY = (sh - drawH) / 2;
                }

                camCtx.save();
                camCtx.translate(sw, 0);
                camCtx.scale(-1, 1);
                camCtx.drawImage(DOM.video, offsetX, offsetY, drawW, drawH);
                camCtx.restore();
            }

            // Draw the box overlay on hand canvas (on top of skeleton)
            const hCtx = DOM.handOverlay.getContext('2d');
            if ((state.phase === "drawing" && state.isDrawingBox) || state.phase === "ready") {
                const box = getBoxRect();
                hCtx.save();
                hCtx.strokeStyle = '#0f0';
                hCtx.lineWidth = 3;
                hCtx.setLineDash([8, 4]);
                hCtx.strokeRect(box.x, box.y, box.w, box.h);

                // Corner markers
                const cornerSize = 15;
                hCtx.setLineDash([]);
                hCtx.lineWidth = 4;
                hCtx.strokeStyle = '#ff0';
                // Top-left
                hCtx.beginPath();
                hCtx.moveTo(box.x, box.y + cornerSize);
                hCtx.lineTo(box.x, box.y);
                hCtx.lineTo(box.x + cornerSize, box.y);
                hCtx.stroke();
                // Top-right
                hCtx.beginPath();
                hCtx.moveTo(box.x + box.w - cornerSize, box.y);
                hCtx.lineTo(box.x + box.w, box.y);
                hCtx.lineTo(box.x + box.w, box.y + cornerSize);
                hCtx.stroke();
                // Bottom-left
                hCtx.beginPath();
                hCtx.moveTo(box.x, box.y + box.h - cornerSize);
                hCtx.lineTo(box.x, box.y + box.h);
                hCtx.lineTo(box.x + cornerSize, box.y + box.h);
                hCtx.stroke();
                // Bottom-right
                hCtx.beginPath();
                hCtx.moveTo(box.x + box.w - cornerSize, box.y + box.h);
                hCtx.lineTo(box.x + box.w, box.y + box.h);
                hCtx.lineTo(box.x + box.w, box.y + box.h - cornerSize);
                hCtx.stroke();

                // Dimension label
                hCtx.setLineDash([]);
                hCtx.font = '14px "Courier New"';
                hCtx.fillStyle = '#0f0';
                hCtx.fillText(`${Math.round(box.w)} × ${Math.round(box.h)}`, box.x, box.y - 8);

                hCtx.restore();
            }

            // Render puzzle pieces from captured image
            if (state.phase === "playing" && state.capturedImage && state.pieces.length === 9) {
                const box = getBoxRect();
                const ps = box.w / 3;
                state.pieces.forEach(p => {
                    const origRow = Math.floor(p.originalIndex / 3);
                    const origCol = p.originalIndex % 3;
                    p.canvas.width = ps;
                    p.canvas.height = ps;
                    const sx = origCol * (state.capturedImage.width / 3);
                    const sy = origRow * (state.capturedImage.height / 3);
                    p.ctx.drawImage(
                        state.capturedImage,
                        sx, sy, state.capturedImage.width / 3, state.capturedImage.height / 3,
                        0, 0, ps, ps
                    );
                });
            }

            // Timer update
            if (state.timerRunning) {
                const diff = Date.now() - state.timerStart;
                const m = Math.floor(diff / 60000).toString().padStart(2, '0');
                const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                const ms = (diff % 1000).toString().padStart(3, '0');
                DOM.timer.innerText = `${m}:${s}:${ms}`;
                state.elapsedTime = diff;
            }

            requestAnimationFrame(renderLoop);
        }

        // ===========================================
        // PUZZLE PIECES
        // ===========================================

        function createPieces(boxSize) {
            clearBoard();
            const ps = boxSize / 3;
            const pcs = [];
            for (let i = 0; i < 9; i++) {
                const piece = document.createElement('div');
                piece.className = 'puzzle-piece';
                piece.style.width = `${ps}px`;
                piece.style.height = `${ps}px`;
                const canvas = document.createElement('canvas');
                canvas.className = 'piece-canvas';
                piece.appendChild(canvas);
                DOM.puzzleContainer.appendChild(piece);
                pcs.push({
                    el: piece,
                    ctx: canvas.getContext('2d'),
                    canvas: canvas,
                    originalIndex: i,
                    currentIndex: i
                });
            }
            state.pieces = pcs;
        }

        function shufflePieces(boxSize) {
            const ps = boxSize / 3;
            let idx = [0, 1, 2, 3, 4, 5, 6, 7, 8];
            for (let i = 8; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [idx[i], idx[j]] = [idx[j], idx[i]];
            }
            if (idx.every((v, i) => v === i)) [idx[0], idx[1]] = [idx[1], idx[0]];
            state.pieces.forEach((p, i) => {
                p.currentIndex = idx[i];
                p.el.classList.add('snapping');
            });
            snapAllToGrid(ps);
        }

        function snapAllToGrid(ps) {
            if (!ps) ps = getBoxRect().w / 3;
            state.pieces.forEach(p => {
                p.el.style.width = `${ps}px`;
                p.el.style.height = `${ps}px`;
                const row = Math.floor(p.currentIndex / 3);
                const col = p.currentIndex % 3;
                p.el.style.left = `${col * ps}px`;
                p.el.style.top = `${row * ps}px`;
            });
        }

        function clearBoard() {
            DOM.puzzleContainer.querySelectorAll('.puzzle-piece').forEach(el => el.remove());
            state.pieces = [];
            state.grabbedPiece = null;
            state.isPinching = false;
        }

        // ===========================================
        // DRAG & DROP (Hand gesture)
        // ===========================================

        function tryGrabPiece(screenX, screenY) {
            // Convert screen coords to puzzle container coords
            const box = getBoxRect();
            const localX = screenX - box.x;
            const localY = screenY - box.y;
            const ps = box.w / 3;

            let grabbed = null;
            for (let i = state.pieces.length - 1; i >= 0; i--) {
                const p = state.pieces[i];
                const px = parseFloat(p.el.style.left) || 0;
                const py = parseFloat(p.el.style.top) || 0;
                if (localX >= px && localX <= px + ps && localY >= py && localY <= py + ps) {
                    grabbed = p;
                    break;
                }
            }
            if (grabbed && !state.grabbedPiece) {
                state.grabbedPiece = grabbed;
                grabbed.el.classList.remove('snapping');
                grabbed.el.classList.add('highlight', 'dragging');
            }
        }

        function handleDrag(screenX, screenY) {
            if (!state.grabbedPiece) return;
            const box = getBoxRect();
            const ps = box.w / 3;
            const localX = screenX - box.x;
            const localY = screenY - box.y;
            let nx = Math.max(0, Math.min(localX - ps / 2, box.w - ps));
            let ny = Math.max(0, Math.min(localY - ps / 2, box.h - ps));
            state.grabbedPiece.el.style.left = `${nx}px`;
            state.grabbedPiece.el.style.top = `${ny}px`;
        }

        function releaseGrabbedPiece() {
            if (!state.grabbedPiece) return;
            const p = state.grabbedPiece;
            p.el.classList.remove('highlight', 'dragging');
            state.grabbedPiece = null;
            snapToGrid(p);
        }

        function snapToGrid(p) {
            const box = getBoxRect();
            const ps = box.w / 3;
            const cx = (parseFloat(p.el.style.left) || 0) + ps / 2;
            const cy = (parseFloat(p.el.style.top) || 0) + ps / 2;
            let col = Math.max(0, Math.min(Math.floor(cx / ps), 2));
            let row = Math.max(0, Math.min(Math.floor(cy / ps), 2));
            const targetIdx = row * 3 + col;

            const existing = state.pieces.find(op => op !== p && op.currentIndex === targetIdx);
            p.el.classList.add('snapping');
            if (existing) {
                existing.el.classList.add('snapping');
                existing.currentIndex = p.currentIndex;
                const eRow = Math.floor(existing.currentIndex / 3);
                const eCol = existing.currentIndex % 3;
                existing.el.style.left = `${eCol * ps}px`;
                existing.el.style.top = `${eRow * ps}px`;
            }
            p.currentIndex = targetIdx;
            p.el.style.left = `${col * ps}px`;
            p.el.style.top = `${row * ps}px`;
            checkWin();
        }

        // ===========================================
        // MANUAL DRAG (Mouse/Touch fallback)
        // ===========================================
        let isManualDragging = false;
        let manualOffset = { x: 0, y: 0 };

        function manualDragStart(e) {
            if (state.phase !== 'playing' || state.isPinching) return;
            const target = e.target.closest('.puzzle-piece');
            if (!target) return;
            if (e.type === 'touchstart') e.preventDefault();

            const p = state.pieces.find(p => p.el === target);
            if (p && !state.grabbedPiece) {
                state.grabbedPiece = p;
                p.el.classList.remove('snapping');
                p.el.classList.add('highlight', 'dragging');
                isManualDragging = true;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const rect = p.el.getBoundingClientRect();
                manualOffset.x = clientX - rect.left;
                manualOffset.y = clientY - rect.top;
            }
        }

        function manualDragMove(e) {
            if (!isManualDragging || !state.grabbedPiece) return;
            if (e.type === 'touchmove') e.preventDefault();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const containerRect = DOM.puzzleContainer.getBoundingClientRect();
            const box = getBoxRect();
            const ps = box.w / 3;
            let nx = Math.max(0, Math.min(clientX - containerRect.left - manualOffset.x, box.w - ps));
            let ny = Math.max(0, Math.min(clientY - containerRect.top - manualOffset.y, box.h - ps));
            state.grabbedPiece.el.style.left = `${nx}px`;
            state.grabbedPiece.el.style.top = `${ny}px`;
        }

        function manualDragEnd() {
            if (!isManualDragging || !state.grabbedPiece) return;
            isManualDragging = false;
            releaseGrabbedPiece();
        }

        // ===========================================
        // TIMER & WIN
        // ===========================================

        function startTimer() {
            state.timerStart = Date.now();
            state.timerRunning = true;
        }

        function stopTimer() { state.timerRunning = false; }

        function checkWin() {
            if (!state.timerRunning) return;
            setTimeout(() => {
                if (state.pieces.every(p => p.originalIndex === p.currentIndex)) {
                    stopTimer();
                    DOM.finalTimeDisplay.innerText = DOM.timer.innerText;
                    DOM.winModal.classList.add('active');
                }
            }, 50);
        }

        // ===========================================
        // LEADERBOARD
        // ===========================================

        function loadLeaderboard() {
            const list = document.getElementById('leaderboardList');
            list.innerHTML = '';
            const scores = JSON.parse(localStorage.getItem('puzzleScores') || '[]');
            if (scores.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:#555">No scores yet.</div>';
            }
            scores.forEach((s, idx) => {
                const item = document.createElement('div');
                item.className = 'leaderboard-item';
                item.innerHTML = `<span>${idx + 1}. ${s.name}</span><span>${s.timeText}</span>`;
                list.appendChild(item);
            });
        }

        function saveScore() {
            const name = DOM.playerName.value.trim() || "Anon";
            const timeText = DOM.finalTimeDisplay.innerText;
            const timeValue = state.elapsedTime;
            const scores = JSON.parse(localStorage.getItem('puzzleScores') || '[]');
            scores.push({ name, timeText, timeValue });
            scores.sort((a, b) => a.timeValue - b.timeValue);
            scores.splice(10);
            localStorage.setItem('puzzleScores', JSON.stringify(scores));

            DOM.winModal.classList.remove('active');
            DOM.playerName.value = '';
            loadLeaderboard();
            DOM.leaderboardPanel.classList.add('open');

            // Reset to drawing phase
            resetToDrawing();
        }

        function resetToDrawing() {
            state.phase = 'drawing';
            state.timerRunning = false;
            state.capturedImage = null;
            clearBoard();
            DOM.puzzleContainer.style.display = 'none';
            DOM.thumbnail.style.display = 'none';
            DOM.timer.style.display = 'none';
            DOM.timer.innerText = '00:00:000';
            DOM.instructions.textContent = '✋ PINCH to draw a box on screen';
            DOM.instructions.style.display = '';
            DOM.startBtn.style.display = 'none';
            DOM.resizeControls.style.display = 'none';
            DOM.btnLeaderboard.style.top = '15px';
        }

        // Boot
        window.addEventListener('load', init);
    </script>
</body>
